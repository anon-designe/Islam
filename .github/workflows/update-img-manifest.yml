name: Update img manifest

on:
  push:
    paths:
      - 'img/**'
      - '!img/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate img/manifest.json
        run: node scripts/generate-img-manifest.js

      - name: Commit manifest if changed
        run: |
          if git diff --quiet img/manifest.json img/gallery.js index.html; then
            echo "Gallery files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/manifest.json img/gallery.js index.html
          git commit -m "chore: update img gallery"
          git push
